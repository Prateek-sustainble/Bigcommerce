<!-- Security Mirror Frameless Mirror calculator embed -->
<!-- Paste this block into your BigCommerce product template, such as single-details.html. -->
<!-- For another product family, duplicate the product template and change only data-sm-type. -->
<link rel="stylesheet" href="https://security-mirror-calculator.onrender.com/security-mirror-widget.css">
<div
  id="security-mirror-calculator"
  data-sm-type="frameless_mirror"
  data-sm-customer-group="{{#if customer}}{{customer.customer_group_name}}{{else}}Guest{{/if}}"
  data-sm-customer-id="{{#if customer}}{{customer.id}}{{/if}}"
></div>
<script src="https://security-mirror-calculator.onrender.com/security-mirror-widget.js"></script>
<script>
  window.SecurityMirrorCalculator.init({
    root: "#security-mirror-calculator",
    apiBase: "https://security-mirror-calculator.onrender.com",
    customerId: {{#if customer}}{{customer.id}}{{else}}null{{/if}},
    customerGroup: "{{#if customer}}{{customer.customer_group_name}}{{else}}Guest{{/if}}",
    hideCustomerField: true,
    lockCustomerGroup: {{#if customer}}true{{else}}false{{/if}}
  });
</script>
